<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شركة غرب الدلتا — Ticket cancellation</title>
  <style>
    body { font: 18px/1.5 system-ui; max-width: 680px; margin: 10vh auto; padding: 0 24px; color: #172033; }
    article { border: 1px solid #ccd3df; border-radius: 16px; padding: 28px; box-shadow: 0 12px 30px #17203314; }
    code { background: #f1f4f8; padding: 3px 7px; border-radius: 6px; }
    button { border: 0; border-radius: 9px; padding: 12px 18px; color: white; background: #b42318; font: inherit; cursor: pointer; }
    pre { min-height: 72px; white-space: pre-wrap; color: #344054; }
  </style>
</head>
<body>
  <article>
    <p><code>BOOKING-42</code></p>
    <p lang="ar" dir="rtl">شركة غرب الدلتا</p>
    <h1>Marsa Matrouh → Alexandria</h1>
    <p>Bus ticket · Departs in 24 hours · Paid EGP 120</p>
    <button id="cancel">Cancel booking</button>
    <pre id="result">Waiting for an action…</pre>
  </article>
  <script>
    const button = document.querySelector("#cancel");
    const result = document.querySelector("#result");
    button.addEventListener("click", async () => {
      const response = await fetch("/api/bookings/BOOKING-42/cancel", {method: "POST"});
      result.textContent = JSON.stringify(await response.json(), null, 2);
      button.disabled = true;
    });
  </script>
</body>
</html>
